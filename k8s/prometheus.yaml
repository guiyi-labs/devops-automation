# Prometheus：Deployment + Service（命名 prometheus，grafana provisioning 的
# datasource url http://prometheus:9090 依赖此名）+ ConfigMap 挂载 prometheus.yml
# 与 prometheus-alerts.yml（保持 compose 的 targets: ['api:8000'] 不变，Service api 提供 DNS）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/prometheus-alerts.yml
    scrape_configs:
      - job_name: easyops-api
        metrics_path: /metrics
        static_configs:
          - targets: ['api:8000']
  prometheus-alerts.yml: |
    groups:
      - name: easyops-alerts
        rules:
          - alert: EasyOpsApiDown
            expr: up{job="easyops-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "EasyOps API 不可用"
              description: "任务 easyops-api 已持续 1 分钟无法抓取指标。"

          - alert: EasyOpsQueueBacklog
            expr: easyops_queue_depth{queue="celery"} > 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Celery 队列积压"
              description: "celery 队列待处理任务数 {{ $value }} 已超过 50，持续 5 分钟。"

          - alert: EasyOpsTaskFailureRateHigh
            expr: |
              sum(rate(easyops_exec_tasks_total{status="failed"}[10m]))
                / (sum(rate(easyops_exec_tasks_total[10m])) + 1) > 0.3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "批量执行失败率过高"
              description: "10 分钟批量执行失败率超过 30%（当前 {{ $value | humanizePercentage }}）。"

          - alert: EasyOpsHostCritical
            expr: easyops_host_health{status="critical"} > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "存在 critical 主机"
              description: "最近一次巡检有 {{ $value }} 台主机为 critical。"

          - alert: EasyOpsInspectionFailures
            expr: rate(easyops_inspection_hosts_total{status="unknown"}[15m]) > 0.2
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "巡检失败主机增多"
              description: "巡检 unknown 主机速率超过 0.2/秒（15 分钟窗口）。"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app: easyops-prometheus}
  template:
    metadata:
      labels: {app: easyops-prometheus}
    spec:
      containers:
        - name: prometheus
          image: docker.m.daocloud.io/prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: prometheus
spec:
  selector: {app: easyops-prometheus}
  ports:
    - name: http
      port: 9090
      targetPort: http