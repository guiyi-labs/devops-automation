{{- if .Values.secret.create }}
# 仅本地演示使用（create=true）。生产默认 create=false，引用预建 Secret。
# 预建方式：kubectl -n <ns> create secret generic <existingSecretName> \
#   --from-literal=MYSQL_PASSWORD=... --from-literal=SECRET_KEY=... \
#   --from-literal=CREDENTIAL_ENCRYPTION_KEY=... --from-literal=INITIAL_ADMIN_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "easyops.secretName" . }}
  namespace: {{ include "easyops.namespace" . }}
type: Opaque
data:
  MYSQL_PASSWORD: {{ .Values.secret.mysqlPassword | default "easyops" | b64enc | quote }}
  SECRET_KEY: {{ .Values.secret.secretKey | default "insecure-demo-secret-key" | b64enc | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ .Values.secret.credentialEncryptionKey | default "insecure-demo-cred-key" | b64enc | quote }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.secret.initialAdminPassword | default "easyops123" | b64enc | quote }}
{{- end }}