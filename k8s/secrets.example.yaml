# EasyOps Secret 模板（占位示例，绝不直接 apply 到真实集群）。
#
# 真实部署时用如下命令创建（值按需替换），然后 kubectl apply -k k8s/：
#
#   kubectl create secret generic easyops-secrets -n easyops \
#     --from-literal=MYSQL_PASSWORD='<强密码>' \
#     --from-literal=SECRET_KEY='<随机 32+ 字符串>' \
#     --from-literal=CREDENTIAL_ENCRYPTION_KEY='<随机 32+ 字符串>' \
#     --from-literal=INITIAL_ADMIN_PASSWORD='<管理员初始密码>'
#
# 以下仅为结构示例（base64 编码的是占位值，非真实凭据）。
apiVersion: v1
kind: Secret
metadata:
  name: easyops-secrets
  namespace: easyops
type: Opaque
data:
  # echo -n 'CHANGE_ME_MYSQL_PASSWORD' | base64
  MYSQL_PASSWORD: "Q0hBTkdFX01FX01ZU1FMX1BBU1NXT1JE"
  # echo -n 'CHANGE_ME_SECRET_KEY' | base64
  SECRET_KEY: "Q0hBTkdFX01FX1NFQ1JFVF9LRVk="
  # echo -n 'CHANGE_ME_CREDENTIAL_KEY' | base64
  CREDENTIAL_ENCRYPTION_KEY: "Q0hBTkdFX01FX0NSRURFTlRJQUxfS0VZ"
  # echo -n 'CHANGE_ME_ADMIN_PASSWORD' | base64
  INITIAL_ADMIN_PASSWORD: "Q0hBTkdFX01FX0FETUlOX1BBU1NXT1JE"