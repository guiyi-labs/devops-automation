name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyops_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: easyops_api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests (pytest)
        run: pytest -v --tb=short
      - name: Coverage gate (global >= 50%)
        run: pytest --cov=. --cov-report=term
      - name: Coverage gate (security modules >= 80%)
        run: pytest --cov=common --cov=config --cov=dependencies --cov=services.ssh_service --cov-fail-under=80
      - name: Dependency audit (pip-audit)
        run: pip-audit
      - name: Alembic migration check (SQLite)
        run: |
          DATABASE_URL=sqlite:///migrate_ci.db alembic upgrade head
          python -c "
          import sqlite3
          conn = sqlite3.connect('migrate_ci.db')
          tables = {r[0] for r in conn.execute(\"select name from sqlite_master where type='table' and name not like 'sqlite_%'\")}
          expected = {'sys_role','sys_user','server_asset','exec_record','exec_host_result',
                      'deploy_project','cron_task','alert_rule','audit_log','system_flag'}
          assert expected <= tables, f'missing tables: {expected - tables}'
          print('alembic migration tables ok:', sorted(expected & tables))
          conn.close()"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyops_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: easyops_web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit (production deps only)
        run: npm audit --omit=dev
      - name: Build
        run: npm run build

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose config --quiet
      - name: Validate ports override config
        run: docker compose -f docker-compose.yml -f docker-compose.ports.yml config --quiet
      - name: Kubernetes manifest schema check (kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/
      - name: Check env example reference
        run: test -f .env.example && echo "env example ok"
      - name: README / docs relative link check
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          failed = []
          for md in [pathlib.Path('README.md'), *pathlib.Path('docs').rglob('*.md')]:
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', text):
                  target = target.split('#')[0].strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  p = (md.parent / target).resolve()
                  if not p.exists():
                      failed.append(f'{md}: -> {target}')
          if failed:
              print('\n'.join(failed))
              sys.exit(1)
          print('all README/docs relative links resolve')
          EOF