# EasyOps Web（Nginx 静态前端 + /api 反向代理）。
# Service 命名 web，NodePort 30080（便于 kind 本机验证；生产可换 Ingress）。
# nginx.conf 的 proxy_pass http://api:8000 依赖集群内 Service 名 api（api.yaml 已定义）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyops-web
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: easyops-web}
  template:
    metadata:
      labels: {app: easyops-web}
    spec:
      containers:
        - name: web
          image: devops-automation-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector: {app: easyops-web}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080