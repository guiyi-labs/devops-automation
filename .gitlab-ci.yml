stages: [build, deploy]
build-api:
  stage: build
  image: docker:latest
  services: [docker:dind]
  script:
    - docker build -t registry.example.com/easyops-api:${CI_COMMIT_SHA} ./easyops_api
deploy-k8s:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - ssh root@deploy-server "kubectl apply -f /opt/easyops/k8s/"
  only: [main]
