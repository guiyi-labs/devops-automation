# Prometheus：Deployment + Service（固定名 prometheus，grafana datasource 依赖）+
# ConfigMap 挂载 prometheus.yml 与 prometheus-alerts.yml。
# ⚠ 内嵌告警规则需与仓库根 prometheus-alerts.yml 保持一致（Kustomize 相同约束）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "easyops.namespace" . }}
  labels:
    {{- include "easyops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/prometheus-alerts.yml
    scrape_configs:
      - job_name: easyops-api
        metrics_path: /metrics
        static_configs:
          - targets: ['api:8000']
  prometheus-alerts.yml: |
    groups:
      - name: easyops-alerts
        rules:
          - alert: EasyOpsApiDown
            expr: up{job="easyops-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "EasyOps API 不可用"
              description: "任务 easyops-api 已持续 1 分钟无法抓取指标。"

          - alert: EasyOpsQueueBacklog
            expr: easyops_queue_depth{queue="celery"} > 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Celery 队列积压"
              description: "celery 队列待处理任务数 {{ printf "{{ $value }}" }} 已超过 50，持续 5 分钟。"

          - alert: EasyOpsTaskFailureRateHigh
            expr: |
              sum(rate(easyops_exec_tasks_total{status="failed"}[10m]))
                / (sum(rate(easyops_exec_tasks_total[10m])) + 1) > 0.3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "批量执行失败率过高"
              description: "10 分钟批量执行失败率超过 30%（当前 {{ printf "{{ $value | humanizePercentage }}" }}）。"

          - alert: EasyOpsHostCritical
            expr: easyops_host_health{status="critical"} > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "存在 critical 主机"
              description: "最近一次巡检有 {{ printf "{{ $value }}" }} 台主机为 critical。"

          - alert: EasyOpsInspectionFailures
            expr: rate(easyops_inspection_hosts_total{status="unknown"}[15m]) > 0.2
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "巡检失败主机增多"
              description: "巡检 unknown 主机速率超过 0.2/秒（15 分钟窗口）。"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "easyops.namespace" . }}
  labels:
    {{- include "easyops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: {{ .Values.replicaCount.prometheus }}
  selector:
    matchLabels:
      {{- include "easyops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "easyops.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: docker.m.daocloud.io/prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.resources.prometheus }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "easyops.namespace" . }}
  labels:
    {{- include "easyops.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: {{ .Values.service.prometheus.type }}
  selector:
    {{- include "easyops.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: {{ .Values.service.prometheus.port }}
      targetPort: http