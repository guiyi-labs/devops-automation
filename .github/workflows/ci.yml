name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyops_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: easyops_api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests (pytest)
        run: pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyops_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: easyops_web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit (production deps only)
        run: npm audit --omit=dev
      - name: Build
        run: npm run build

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose config --quiet
      - name: Validate ports override config
        run: docker compose -f docker-compose.yml -f docker-compose.ports.yml config --quiet
      - name: Check env example reference
        run: test -f .env.example && echo "env example ok"