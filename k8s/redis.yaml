# Redis 6（对齐 Compose 默认版本）。Compose 的 redis_data 卷 → K8s PVC。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: easyops-redis}
  template:
    metadata:
      labels: {app: easyops-redis}
    spec:
      containers:
        - name: redis
          image: docker.m.daocloud.io/library/redis:6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: easyops
  labels:
    app.kubernetes.io/name: easyops
    app.kubernetes.io/component: redis
spec:
  selector: {app: easyops-redis}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: easyops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi